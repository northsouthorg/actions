name: Nightly Bench CI

on:
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis-cache:
        image: redis:alpine
        ports:
          - 6379:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 6380:6379

    steps:
      - name: Checkout Tests Repository
        uses: actions/checkout@v7
        with:
          repository: northsouthorg/tests
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }} # Required if other-repo is private
          path: tests
          
      - name: Setup Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install System Dependencies & Bench
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev redis-tools
          pip install frappe-bench

      - name: Initialize Frappe Bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-16 --apps_path ~/tests/apps.json ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6380

      - name: Install App & Create Site
        run: |
          cd ~/frappe-bench
          jq -r '.[] | .url' sites/apps.json | while read -r url; do
            branch=$(jq -r --arg url "$url" '.[] | select(.url==$url) | .branch // "version-15"' ~/tests/apps.json)
            bench get-app "$url" --branch "$branch"
          done
          bench new-site test_site --mariadb-root-password root --admin-password admin --no-mariadb-socket
          jq -r '.[] | .url' sites/apps.json | while read -r url; do
            branch=$(jq -r --arg url "$url" '.[] | select(.url==$url) | .branch // "version-15"' ~/tests/apps.json)
            bench --site test_site install-app "$url"
          done
          bench --site test_site set-config allow_tests true

      - name: Run Tests
        run: |
          cd ~/frappe-bench
          bench --site test_site run-tests --app erpnext
